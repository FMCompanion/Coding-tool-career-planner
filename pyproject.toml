[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmcompanion-career-planner"
version = "0.1.0"
description = "FM Companion save-aware Career Planner reference implementation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
